<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Flappy Braves - Svelte</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./svelte-game/public/build/bundle.css">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;

      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      box-sizing: border-box;
    }
    
    #flappy-braves-game-container {
      width: 100%;
      max-width: 800px;

      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);

      min-height: 60vh;

    @media (max-width: 768px) {
      #flappy-braves-game-container {
        max-width: 95%;
        border-radius: 8px;
        aspect-ratio: 4/3.5;
        min-height: 55vh;
      }
    }
    
    @media (max-width: 480px) {
      #flappy-braves-game-container {
        max-width: 98%;
        border-radius: 6px;
        aspect-ratio: 4/3.5;
        min-height: 50vh;
      }
      
      body {
        padding: 10px;
      }
