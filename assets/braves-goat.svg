<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Definición de gradientes y efectos -->
  <defs>
    <radialGradient id="bodyGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FF1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF0000;stop-opacity:1" />
    </radialGradient>
    
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Cuerpo principal de la cabrita - forma más redondeada como el logo -->
  <path d="M50,25 C30,25 25,40 25,55 C25,75 35,80 50,80 C65,80 75,75 75,55 C75,40 70,25 50,25 Z" 
        fill="url(#bodyGradient)" filter="url(#neonGlow)" />
  
  <!-- Cuerno izquierdo - más curvo y prominente como en el logo -->
  <path d="M35,35 C25,25 15,30 25,40 C30,45 35,40 35,35 Z" 
        fill="#FF0000" filter="url(#neonGlow)" />
  
  <!-- Cuerno derecho - más curvo y prominente como en el logo -->
  <path d="M65,35 C75,25 85,30 75,40 C70,45 65,40 65,35 Z" 
        fill="#FF0000" filter="url(#neonGlow)" />
  
  <!-- Ojos - más grandes y expresivos como en el logo -->
  <circle cx="40" cy="45" r="6" fill="white" />
  <circle cx="60" cy="45" r="6" fill="white" />
  
  <!-- Pupilas - más grandes -->
  <circle cx="40" cy="45" r="3" fill="black" />
  <circle cx="60" cy="45" r="3" fill="black" />
  
  <!-- Contorno adicional para definir mejor la forma -->
  <path d="M50,25 C30,25 25,40 25,55 C25,75 35,80 50,80 C65,80 75,75 75,55 C75,40 70,25 50,25 Z" 
        fill="none" stroke="#FF3333" stroke-width="1.5" />
        
  <!-- Detalles faciales adicionales para parecerse más al logo -->
  <path d="M40,60 C45,65 55,65 60,60" 
        fill="none" stroke="#FF3333" stroke-width="2" stroke-linecap="round" />
</svg> 